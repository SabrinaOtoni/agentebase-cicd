[pytest]
testpaths = tests
addopts = -ra
markers =
    unitario: funções puras, sem rede (ferramentas, contexto, canário, avaliador, empacotamento)
    contrato: a declaração das ferramentas (o que o modelo lê) bate com o código Python
    run_level: o loop responder() completo, com o cliente da OpenAI trocado por um dublê
    api: rotas da API (FastAPI TestClient) com o agente dublado — sem chamar o modelo
