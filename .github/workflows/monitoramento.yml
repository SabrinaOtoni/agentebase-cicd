# Avaliação online (pós-deploy): todo dia, a produção é testada de novo.
#
# O modelo do provedor, a rede e a cota mudam sem nenhum commit nosso. Este
# workflow refaz o smoke test e os casos críticos do eval contra produção e,
# se algo falhar, abre uma issue — o caso que falhou vira insumo para o
# golden set (o ciclo de realimentação da aula 2).

name: Monitoramento

on:
  schedule:
    - cron: "0 12 * * *" # 9h em Brasília
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  producao:
    name: Produção está saudável?
    runs-on: ubuntu-latest
    env:
      URL: ${{ vars.PRODUCTION_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Smoke test
        run: python scripts/smoke.py "$URL"

      - name: Casos críticos do eval
        run: |
          casos=$(python -c "import json; c=json.load(open('config/agente.json'))['gates_eval']['categorias_criticas']; g=json.load(open('evals/golden_set.json'))['casos']; print(','.join(x['id'] for x in g if x['categoria'] in c))")
          python evals/avaliar.py --url "$URL" --casos "$casos" --saida relatorios/monitoramento.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-monitoramento
          path: relatorios/

      - name: Abrir issue se falhou
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Monitoramento: produção reprovou em $(date -u +%Y-%m-%d)" \
            --body "A avaliação diária de produção falhou. Detalhes: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
